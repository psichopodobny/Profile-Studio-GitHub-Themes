<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Winter Profile</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <p class="eyebrow">GITHUB THEMES / BY PSICHOPODOBNY</p><h1>Winter Profile</h1>
  <p class="intro">Свой вид для любого личного профиля.</p>
  <button id="studio" type="button">Открыть Studio / сборки тем ↗</button>
  <label><span>Включить расширение</span><input type="checkbox" id="enabled" checked></label>
  <label><span>Применять оформление</span><select id="scope"><option value="global">Для всех профилей</option><option value="profile" id="profile-option" disabled>Для отдельного профиля</option></select></label>
  <div class="profile-picker"><input id="profile-login" type="text" maxlength="40" placeholder="Ник GitHub" aria-label="Ник GitHub" autocomplete="off"><button id="select-profile" type="button" class="secondary">Выбрать</button></div>
  <p id="scope-note" class="note" aria-live="polite">Общее оформление для всех личных профилей.</p>
  <label><span>Анимация и движение за курсором</span><input type="checkbox" id="motion" checked></label>
  <label><span>Снег</span><input type="checkbox" id="snow" checked></label>
  <label><span>Фон</span><select id="background"><option value="forest">Зимний лес</option><option value="lake">Туманное озеро</option><option value="midnight">Midnight</option><option value="neon">Neon</option><option value="aurora">Aurora</option><option value="uikole">uikole</option><option value="ember">Ember</option><option value="custom">Моя картинка</option></select></label>
  <label class="file-label"><span>Загрузить свой фон</span><input type="file" id="upload" accept="image/png,image/jpeg,image/webp"></label>
  <label><span>Цвет акцента</span><input type="color" id="accent" value="#d0e0ed"></label>
  <label><span>Шрифт</span><select id="font"><option value="system">Системный</option><option value="mono">Моноширинный</option><option value="serif">С засечками</option><option value="rounded">Мягкий</option><option value="book">Книжный</option><option value="custom">Загруженный в Studio</option></select></label>
  <button id="reset" class="secondary" type="button">Сбросить оформление</button>
  <div class="sharing"><button id="export" class="secondary" type="button">Сохранить тему</button><button id="import" class="secondary" type="button">Загрузить тему</button></div>
  <input id="import-file" type="file" accept="application/json,.json" hidden>
  <button id="personal" type="button">Профиль автора ↗</button>
  <button id="duo" class="secondary" type="button">psichopodobny and uikole ↗</button>
  <p class="note">Настройки хранятся в этом браузере. Поделиться оформлением можно через файл темы.</p>
  <p id="status" role="status" aria-live="polite"></p>
  <script src="options.js"></script><script src="popup.js"></script>
</body></html>
