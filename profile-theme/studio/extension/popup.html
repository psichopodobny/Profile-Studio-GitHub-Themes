<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="dark" />
    <link rel="stylesheet" href="popup.css" />
    <link rel="icon" data-studio-icon href="media/icon-48.png" />
    <title>Profile Studio</title>
  </head>
  <body>
    <header class="popup-brand">
      <img
        class="brand-logo"
        src="media/icon-128.png"
        alt=""
        width="46"
        height="46"
      />
      <div>
        <p class="eyebrow">GITHUB THEMES</p>
        <h1>Profile Studio</h1>
      </div>
    </header>
    <p class="intro">Оформление, которое выбираешь ты.</p>
    <button id="studio">Открыть редактор ↗</button>
    <div class="profile-picker">
      <input
        id="profile-login"
        maxlength="39"
        placeholder="GitHub-ник"
        aria-label="GitHub-ник"
      /><button
        id="open-profile"
        class="secondary"
        aria-label="Открыть профиль"
      >
        ↗
      </button>
    </div>
    <label
      ><span>Включить расширение</span><input id="enabled" type="checkbox"
    /></label>
    <label
      ><span>Темы владельцев профилей</span
      ><input id="showPublished" type="checkbox"
    /></label>
    <p class="note">
      При включении GitHub получает ник открытого профиля для поиска публичного
      profile-studio.json. Без cookies и токенов.
    </p>
    <label
      ><span>Моя базовая тема на остальных профилях</span
      ><input id="styleUnpublished" type="checkbox"
    /></label>
    <button id="gallery" class="secondary">Темы сообщества и сборки ↗</button
    ><button id="clear-profile" class="secondary">
      Убрать мою тему с этого профиля
    </button>
    <p class="note">
      Локальная тема имеет приоритет. Убери её, чтобы увидеть опубликованную
      тему владельца.
    </p>
    <p id="status" role="status" aria-live="polite"></p>
    <script src="branding.js"></script>
    <script src="options.js"></script>
    <script src="consent.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
